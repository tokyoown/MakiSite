<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakiLauncher — Вход</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="shortcut icon" href="favicon.ico">
<style>
  :root {
    --bg: #0a0b10;
    --surface: #12131c;
    --surface2: #171926;
    --border: #26293d;
    --accent: #fe5e10;
    --accent2: #ff7a3a;
    --accent3: #ff9f70;
    --glow: rgba(254,94,16,0.4);
    --red: #ef4444;
    --text: #f5f6fa;
    --text2: #9ba3b8;
    --text3: #5c6275;
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Background effects */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    animation: float 8s ease-in-out infinite;
  }
  .bg-orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(254,94,16,0.12), transparent 70%);
    top: -100px; left: -100px;
  }
  .bg-orb-2 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(229,57,53,0.08), transparent 70%);
    bottom: -80px; right: -80px;
    animation-delay: -4s;
  }
  @keyframes float {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(20px, -20px); }
  }

  /* Grid pattern */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  .login-wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    padding: 20px;
  }

  .login-logo {
    text-align: center; margin-bottom: 36px;
  }
  .login-logo-icon {
    width: 72px; height: 72px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
    filter: drop-shadow(0 0 24px var(--glow));
    animation: logoPulse 3s ease-in-out infinite;
  }
  .login-logo-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
  @keyframes logoPulse {
    0%, 100% { filter: drop-shadow(0 0 20px var(--glow)); }
    50% { filter: drop-shadow(0 0 34px rgba(254,94,16,0.65)); }
  }
  .login-logo-title {
    font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
  }
  .login-logo-title span { color: var(--accent); }
  .login-logo-sub { font-size: 14px; color: var(--text3); margin-top: 6px; }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 32px;
    box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(254,94,16,0.08);
    animation: cardIn 0.4s ease;
  }
  @keyframes cardIn {
    from { opacity:0; transform: translateY(20px); }
    to { opacity:1; transform: translateY(0); }
  }

  .login-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .login-sub { font-size: 14px; color: var(--text3); margin-bottom: 28px; }

  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
  .input-wrap { position: relative; }
  .input-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 16px; pointer-events: none;
  }
  input {
    width: 100%; padding: 12px 14px 12px 42px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 15px;
    font-family: inherit; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(254,94,16,0.2);
  }
  input::placeholder { color: var(--text3); }
  .toggle-password {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: 16px; padding: 0;
    transition: color 0.2s;
  }
  .toggle-password:hover { color: var(--text2); }

  .btn-login {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent), #e53935);
    border: none; border-radius: 10px;
    color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 0 30px var(--glow);
    margin-top: 8px;
  }
  .btn-login:hover { transform: translateY(-1px); box-shadow: 0 0 50px var(--glow); }
  .btn-login:active { transform: translateY(0); }

  .error-msg {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px; padding: 12px 16px;
    color: var(--red); font-size: 13px; font-weight: 600;
    margin-bottom: 16px; display: none;
    align-items: center; gap: 8px;
  }
  .error-msg.show { display: flex; }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .back-link {
    text-align: center; margin-top: 20px;
    font-size: 13px; color: var(--text3);
  }
  .back-link a { color: var(--accent2); text-decoration: none; }
  .back-link a:hover { text-decoration: underline; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    display: inline-block; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-icon"><img src="assets/icon.png" alt="MakiLauncher"></div>
    <div class="login-logo-title">Maki<span>Launcher</span></div>
    <div class="login-logo-sub">Панель управления</div>
  </div>

  <div class="login-card">
    <div class="login-title">Добро пожаловать</div>
    <div class="login-sub">Войди чтобы управлять сборками и настройками</div>

    <div class="error-msg" id="error-msg">
      ❌ Неверный логин или пароль
    </div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="form-group">
        <label for="username">Логин</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" id="username" placeholder="Введи логин" autocomplete="username" required />
        </div>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="Введи пароль" autocomplete="current-password" required />
          <button type="button" class="toggle-password" onclick="togglePass()">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="login-btn">
        Войти →
      </button>
    </form>
  </div>

  <div class="back-link">
    <a href="index.html">← Вернуться на главную</a>
  </div>
</div>

<script>
// Credentials (static, client-side — for simple personal dashboard on GitHub Pages)
const CREDENTIALS = { login: 'tokyo_own_admin', password: 'po_ke_monA_z987' };
const SESSION_KEY = 'maki_admin_session';

function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('error-msg');

  // Show loading
  btn.innerHTML = '<span class="spinner"></span>Вход...';
  btn.disabled = true;
  err.classList.remove('show');

  setTimeout(() => {
    const login = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;

    let isValid = (login === CREDENTIALS.login && pass === CREDENTIALS.password);
    try {
      const custom = JSON.parse(localStorage.getItem('maki_admin_creds') || 'null');
      if (custom && custom.login && custom.password) {
        if (login === custom.login.trim() && pass === custom.password) {
          isValid = true;
        }
      }
    } catch(e) {}

    if (isValid) {
      // Set session
      sessionStorage.setItem(SESSION_KEY, btoa(login + ':' + Date.now()));
      // Redirect
      btn.innerHTML = '✅ Успешно!';
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 400);
    } else {
      // Error
      btn.innerHTML = 'Войти →';
      btn.disabled = false;
      err.classList.add('show');
      document.getElementById('login-form').classList.add('shake');
      setTimeout(() => document.getElementById('login-form').classList.remove('shake'), 400);
      document.getElementById('password').value = '';
      document.getElementById('username').focus();
    }
  }, 700);
}

function togglePass() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

// If already logged in, skip login page
if (sessionStorage.getItem('maki_admin_session')) {
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
